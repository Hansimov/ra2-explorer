[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ra2-explorer"
version = "0.13.1"
description = "Local-first Red Alert 2 asset explorer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ra2-explorer contributors" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.116,<1",
  "opencc>=1.4.2,<2",
  "pillow>=11.3,<13",
  "pypinyin>=0.55,<1",
  "pycryptodome>=3.23,<4",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]
release = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
ra2exp = "ra2_explorer.cli:main"
ra2-explorer = "ra2_explorer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ra2_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
